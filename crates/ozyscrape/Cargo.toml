[package]
name = "ozyscrape"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic HTML extraction and adaptive selectors for Rust"
[dependencies]
ozy-core = { path = "../ozy-core" }
scraper = "0.24"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
thiserror.workspace = true
html2md = "0.2"
strsim = "0.11"
regex = "1"
futures-util = "0.3"
[dev-dependencies]
criterion = "0.7"
[[bench]]
name = "extraction"
harness = false
