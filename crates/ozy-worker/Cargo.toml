[package]
name = "ozy-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Optional isolated Rust worker: Tesseract OCR and Chromium rendering for the OZY platform"

[features]
default = []
# Requires libtesseract and libleptonica (see worker/Dockerfile).
ocr = ["dep:tesseract"]
# Requires a Chromium/Chrome executable at runtime (CHROME_PATH or on PATH).
browser = ["dep:chromiumoxide"]

[dependencies]
ozy-core = { path = "../ozy-core" }
ozy-auth = { path = "../ozy-auth" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
base64.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tesseract = { version = "0.15", optional = true }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime", "bytes"], optional = true }
