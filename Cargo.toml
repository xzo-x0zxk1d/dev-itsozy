[package]
name = "ozy-platform"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = [
    "crates/ozy-core",
    "crates/ozyscrape",
    "crates/ozy-db",
    "crates/ozy-auth",
    "crates/ozy-api",
    "crates/ozy-worker",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "http2"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
futures-util = "0.3"
dotenvy = "0.15"

[dependencies]
axum.workspace = true
tokio.workspace = true
vercel_runtime = { version = "2.4", features = ["axum"] }
tower.workspace = true
serde_json.workspace = true
sqlx.workspace = true
ozy-api = { path = "crates/ozy-api" }
ozy-auth = { path = "crates/ozy-auth" }
ozy-db = { path = "crates/ozy-db" }
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[[bin]]
name = "entry"
path = "api/entry.rs"

[[bin]]
name = "ozy-local"
path = "src/local.rs"

[[bin]]
name = "ozy-ops"
path = "src/ops.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
